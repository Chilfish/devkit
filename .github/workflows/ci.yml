name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint:check
      - run: bun run test:coverage
      - run: bun run build
      - run: bun run verify:package
      - run: bun run check:docs
      - run: bun run example
      - run: bun examples/cli.ts describe > /dev/null
      - run: bun examples/cli.ts dev db --dry-run --json > /dev/null

      - name: Verify build output
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/shared/index.js
          test -f dist/cli/index.js
          test -f dist/env/index.js
          test -f dist/local/index.js
          test -f dist/proxy/index.js
          test -f dist/storage/index.js
          test -f dist/commands/index.js
          test -f dist/bin/proxy.js

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEVKIT_PG_SMOKE: '1'
      DEVKIT_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run test:integration

  windows:
    name: Windows (Node 24)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint:check
      - run: bun run test
      - run: bun run build
      - run: bun run verify:package

  runtime:
    name: Runtime Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22.22 is the engines floor; the build toolchain itself needs Node >=22.
        node: [22.22, 24]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Import ESM build
        run: node --input-type=module -e "const m = await import('./dist/index.js'); if (typeof m.defineDevkit !== 'function') process.exit(1)"

      - name: Import CJS build
        run: node -e "const m = require('./dist/index.cjs'); if (typeof m.defineDevkit !== 'function') process.exit(1)"
