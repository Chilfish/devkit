name: Feature request
description: Propose a new capability or improvement
title: 'feat: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the use case. devkit only reuses capabilities seen in at least two projects, and new runtime dependencies need justification.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation did you hit? How do you work around it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you expect, with example code.
      render: ts
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, and why they fall short.
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and found no duplicate
          required: true
        - label: I understand that a new runtime dependency needs extra justification
          required: true
