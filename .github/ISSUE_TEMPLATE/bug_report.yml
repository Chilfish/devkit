name: Bug report
description: Report a reproducible defect
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Before submitting: search existing issues, read docs/README.md, and try the latest version.
        Report security issues through SECURITY.md, not here.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the full error output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps, code or a link to a minimal repository.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or commit hash.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, package manager and version.
    validations:
      required: true
